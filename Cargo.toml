[workspace]
resolver = "3"
members = [
    "crates/caruspex-i18n",
    "crates/caruspex-vehicles",
    "crates/caruspex-data",
    "crates/caruspex-link",
    "crates/caruspex-j2534",
    "crates/caruspex-protocols",
    "crates/caruspex-net",
    "crates/caruspex-record",
    "crates/caruspex-analysis",
    "crates/caruspex-advice",
    "crates/caruspex-demo",
    "crates/caruspex-pdf",
    "crates/caruspex-tune",
    "crates/caruspex-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.23.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SenseiIssei/Caruspex"
authors = ["SenseiIssei"]
rust-version = "1.90"   # what tauri 2.12 needs

[workspace.dependencies]
caruspex-i18n = { path = "crates/caruspex-i18n" }
caruspex-vehicles = { path = "crates/caruspex-vehicles" }
caruspex-data = { path = "crates/caruspex-data" }
caruspex-link = { path = "crates/caruspex-link" }
caruspex-j2534 = { path = "crates/caruspex-j2534" }
caruspex-protocols = { path = "crates/caruspex-protocols" }
caruspex-net = { path = "crates/caruspex-net" }
caruspex-record = { path = "crates/caruspex-record" }
caruspex-analysis = { path = "crates/caruspex-analysis" }
caruspex-advice = { path = "crates/caruspex-advice" }
caruspex-demo = { path = "crates/caruspex-demo" }
caruspex-pdf = { path = "crates/caruspex-pdf" }
caruspex-tune = { path = "crates/caruspex-tune" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
serialport = "4"
libloading = "0.9"
btleplug = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
miniz_oxide = "0.9"
# Local time for reports, crash files and the log (chrono is unmaintained,
# RUSTSEC-2026-0543). The default features read the system time zone; on
# Windows they bundle the time zone database, which Windows does not have.
jiff = "1.0.0"
# Property tests of the parsers (fuzz-style, on the stable toolchain).
proptest = { version = "1.12", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
