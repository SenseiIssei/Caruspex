name: Pages

# The documentation website (docs/site) on GitHub Pages. The build always
# runs; it is published only when the repository variable PAGES_ENABLED is
# 'true' (Settings > Secrets and variables > Actions > Variables) and Pages is
# switched on with "GitHub Actions" as the source (Settings > Pages).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/readme_languages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one is not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: python docs/site/build.py --check --out _site

      - name: Upload for Pages
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
