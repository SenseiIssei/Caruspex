name: Pages

# The documentation website (docs/site) on GitHub Pages. The build always
# runs; it is published only when the repository variable PAGES_ENABLED is
# 'true' (Settings > Secrets and variables > Actions > Variables) and Pages is
# switched on with "GitHub Actions" as the source (Settings > Pages).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/readme_languages.py"
      - ".github/workflows/pages.yml"
  # Once a month, so the Expires date of /.well-known/security.txt
  # (docs/site/build.py) never runs out while the site stays unchanged.
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one is not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: python docs/site/build.py --check --out _site

      - name: Upload for Pages
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
