name: Audit

# Known vulnerabilities in the dependencies: RustSec for every crate of
# Cargo.lock and npm audit for the packages of the interface bundle
# (tools/audit.py). On every push to main and pull request that changes the
# dependencies or this check, and once a week, because new advisories appear
# without any change here. A finding that does not affect Caruspex is
# accepted with a reason and an expiry date in tools/audit_exceptions.toml
# (SECURITY.md, "Dependencies").
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "app/package.json"
      - "app/package-lock.json"
      - "tools/audit.py"
      - "tools/audit_exceptions.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "app/package.json"
      - "app/package-lock.json"
      - "tools/audit.py"
      - "tools/audit_exceptions.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned: a new cargo-audit can change its report format.
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag instead of the branches stable and nightly, which only set
      # the default of `toolchain`; the channel is named below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Keeps the installed cargo-audit between runs (cache-bin).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: cargo-audit
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q " $CARGO_AUDIT_VERSION\$"; then
            cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
          fi
          cargo audit --version

      - name: Known vulnerabilities
        run: python tools/audit.py
