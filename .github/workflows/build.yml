name: Build

on:
  push:
    branches: [main]
    # A version tag (v0.9.0) also publishes a release with the packages.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Every step runs in bash so Windows, Linux and macOS share one syntax.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting, lints, generated tables and translations: once, on Linux.
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Generated tables are up to date
        run: |
          python tools/gen_dtc.py
          python tools/gen_vehicles.py
          python tools/gen_ecus.py
          python tools/gen_pids.py
          git add --intent-to-add crates
          git diff --exit-code -- 'crates/*/src/generated'

      # Every text in every language: new texts in the code must be
      # translated before they reach main (see translations/TRANSLATING.md).
      - name: Translations are complete
        run: python tools/i18n_rust.py --strict

      - name: README language bar is current
        run: python tools/readme_languages.py --check

      - name: Interface
        env:
          I18N_STRICT: "1"
        run: |
          npm --prefix app ci
          npm --prefix app run build

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: caruspex-windows-x64
          # 22.04 on purpose: the AppImage then also runs on older systems,
          # it needs at least the glibc of the machine that built it.
          - name: Linux
            os: ubuntu-22.04
            artifact: caruspex-linux-x64
          - name: macOS
            os: macos-15
            artifact: caruspex-macos

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev libudev-dev \
            pkg-config file patchelf libfuse2

      - uses: Swatinem/rust-cache@v2

      # Built before the tests: the app has the interface built in.
      - name: Interface
        run: |
          npm --prefix app ci
          npm --prefix app run build

      - name: Tests
        run: cargo test --workspace

      - name: Inno Setup (Windows only)
        if: runner.os == 'Windows'
        run: |
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Package
        env:
          REQUIRE_INSTALLER: "1"
        run: bash tools/package.sh

      # Install the package like a user, start both programs, uninstall.
      - name: Smoke test
        run: bash tools/smoke_test.sh smoke

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-smoke
          path: smoke/
          if-no-files-found: ignore

  # Only for version tags: one release with all packages and the change list
  # from changelog/<version>.md.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the project version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([0-9.]*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          test -f "changelog/$version.md" || { echo "changelog/$version.md is missing" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: caruspex-*
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upload
          find artifacts -path '*-smoke*' -prune -o -type f -print -exec cp {} upload/ \;
          ls -l upload
          gh release create "$GITHUB_REF_NAME" upload/* \
            --title "Caruspex ${{ steps.version.outputs.version }}" \
            --notes-file "changelog/${{ steps.version.outputs.version }}.md" \
            --verify-tag
