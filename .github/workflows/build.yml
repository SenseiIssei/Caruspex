name: Build

on:
  push:
    branches: [main]
    # A version tag (v0.9.0) also publishes a release with the packages.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read only by default. Pull requests from forks get a read-only token and no
# secrets from GitHub anyway; the two jobs that publish (release and
# android-release) ask for more themselves and never run for pull requests.
permissions:
  contents: read

# A new push to a pull request replaces the run of the previous one. Every
# other run (main, version tags, by hand) has a group of its own, so it is
# never queued or cancelled.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Every step runs in bash so Windows, Linux and macOS share one syntax.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Built here means published: only these builds look for updates
  # (update::official_build), local and test builds stay quiet.
  CARUSPEX_OFFICIAL_BUILD: "1"

jobs:
  # Formatting, lints, generated tables and translations: once, on Linux.
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    # A hanging package mirror should fail fast, not block for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag instead of the branches stable and nightly, which only set
      # the default of `toolchain`; the channel is named below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages
        run: |
          # On some runners the name resolution fails ('Temporary failure
          # resolving'); public resolvers as a fallback keep apt working.
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '%s\n' '[Resolve]' 'DNS=1.1.1.1 8.8.8.8' 'FallbackDNS=9.9.9.9' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved || true
          getent hosts azure.archive.ubuntu.com archive.ubuntu.com || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all --check

      - name: Generated tables are up to date
        run: |
          python tools/gen_dtc.py
          python tools/gen_vehicles.py
          python tools/gen_ecus.py
          python tools/gen_pids.py
          python tools/gen_engines.py
          python tools/gen_wmi.py
          # The opendbc packs in data/opendbc are written from a download
          # cache by tools/gen_opendbc.py and refreshed by hand; gen_pids.py
          # above turns them into Rust like data/pids.
          # The OBDb packs need the download cache and are refreshed by hand
          # (see tools/gen_obdb.py); the conversion is checked offline on
          # real OBDb commands with their recorded answers.
          python tools/gen_obdb.py --fixtures
          # Wikidata dimensions: the Rust table from the committed CSV, and
          # the conversion and matching on recorded answers (both offline).
          python tools/gen_dimensions.py
          python tools/gen_dimensions.py --fixtures
          # The copy of the catalog for the browser preview and the X-ray
          # tests: it fell behind once when the trucks came (ids shifted).
          python app/scripts/extract-catalog.py
          git add --intent-to-add crates
          git diff --exit-code -- 'crates/*/src/generated' 'crates/caruspex-record/tests/fixtures' 'crates/caruspex-vehicles/tests/fixtures' 'app/src/api/mock/data'

      # Every text in every language: new texts in the code must be
      # translated before they reach main (see translations/TRANSLATING.md).
      - name: Translations are complete
        run: python tools/i18n_rust.py --strict

      - name: README language bar is current
        run: python tools/readme_languages.py --check

      # The documentation website in all languages (published by pages.yml).
      - name: Documentation website builds
        run: python docs/site/build.py --check --out target/docs-site

      - name: Package manager templates
        run: python tools/dist_manifests.py --check-templates

      - name: Interface
        env:
          I18N_STRICT: "1"
        run: |
          npm --prefix app ci
          npm --prefix app run build
          npm --prefix app test

      # The start of the app stays small: a large dependency or data file in
      # the entry chunk fails here (budgets and how to look in
      # docs/performance.md).
      - name: Interface size budget
        run: python tools/bundle_budget.py
      # The licences of every crate, npm package and Android library the
      # programs ship; needs app/node_modules from the step above. A
      # dependency update (Dependabot) changes Cargo.lock or package-lock.json
      # and with them this file: the step then writes the new file and the
      # next one hands it over as an artifact. Nothing is pushed from here,
      # the run has a read-only token (CONTRIBUTING.md, "Dependency updates").
      - name: Third party notices are current
        id: notices
        run: |
          if python tools/gen_notices.py --check; then exit 0; fi
          python tools/gen_notices.py
          mkdir -p notices-update
          cp THIRD_PARTY_NOTICES.md notices-update/
          git diff --stat -- THIRD_PARTY_NOTICES.md
          echo "::error file=THIRD_PARTY_NOTICES.md::THIRD_PARTY_NOTICES.md is out of date. On the branch of this pull request run 'npm --prefix app ci' and 'python tools/gen_notices.py', or take the new file from this run with 'gh run download $GITHUB_RUN_ID -n third-party-notices --repo $GITHUB_REPOSITORY', then check the diff and commit it."
          exit 1

      - name: Upload the new notices
        if: failure() && steps.notices.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: notices-update/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  # AddressSanitizer (with LeakSanitizer) on the tests of the modules with
  # unsafe code: the J2534 crate, SocketCAN in caruspex-net (over a virtual
  # vcan0 when the runner can load the module) and classic Bluetooth in
  # caruspex-link. rustc has no UndefinedBehaviorSanitizer; the second run
  # switches on Rust's own checks for undefined behaviour in the standard
  # library instead (-Zub-checks with a rebuilt std). Nightly only, so the
  # job may fail without blocking anything: it is not a required check.
  # The J2534 driver calls themselves are Windows only and not covered here.
  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      TARGET: x86_64-unknown-linux-gnu
      CARUSPEX_TEST_VCAN: vcan0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rust-src

      - name: System packages
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libdbus-1-dev libudev-dev pkg-config

      - name: Virtual CAN interface
        run: |
          # vcan is in the extra modules of the runner's kernel. Without it
          # the SocketCAN test only checks the error paths.
          if sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vcan; then
            sudo ip link add dev vcan0 type vcan
            sudo ip link set vcan0 mtu 72
            sudo ip link set up vcan0
            ip -details link show vcan0
          else
            echo "::warning::vcan is not available, the SocketCAN test runs without an interface"
          fi

      - name: AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
        run: |
          cargo test -Zbuild-std --target "$TARGET" -p caruspex-j2534 --lib
          cargo test -Zbuild-std --target "$TARGET" -p caruspex-net --lib socketcan
          cargo test -Zbuild-std --target "$TARGET" -p caruspex-link --lib bt_classic

      - name: Undefined behaviour checks
        env:
          RUSTFLAGS: -Zub-checks=yes -Cdebug-assertions=yes -Coverflow-checks=yes
        run: |
          cargo test -Zbuild-std --target "$TARGET" -p caruspex-j2534 --lib
          cargo test -Zbuild-std --target "$TARGET" -p caruspex-net --lib socketcan
          cargo test -Zbuild-std --target "$TARGET" -p caruspex-link --lib bt_classic

  build:
    name: ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: caruspex-windows-x64
          # 22.04 on purpose: the AppImage then also runs on older systems,
          # it needs at least the glibc of the machine that built it.
          - name: Linux
            os: ubuntu-22.04
            artifact: caruspex-linux-x64
          - name: macOS
            os: macos-15
            artifact: caruspex-macos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages (Linux only)
        if: runner.os == 'Linux'
        run: |
          # On some runners the name resolution fails ('Temporary failure
          # resolving'); public resolvers as a fallback keep apt working.
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '%s\n' '[Resolve]' 'DNS=1.1.1.1 8.8.8.8' 'FallbackDNS=9.9.9.9' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved || true
          getent hosts azure.archive.ubuntu.com archive.ubuntu.com || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev libudev-dev \
            pkg-config file patchelf libfuse2 xvfb

      # The 32-bit J2534 bridge: its test and the package need the target.
      - name: 32-bit target (Windows only)
        if: runner.os == 'Windows'
        run: rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Built before the tests: the app has the interface built in.
      - name: Interface
        run: |
          npm --prefix app ci
          npm --prefix app run build

      - name: Tests
        run: cargo test --workspace

      - name: Inno Setup (Windows only)
        if: runner.os == 'Windows'
        run: |
          # Only when the runner image lacks it; then the version the image has
          # (windows-2025 lists Inno Setup 6.7.1), not whatever is newest.
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --version 6.7.1 -y --no-progress
          fi

      - name: Package
        env:
          REQUIRE_INSTALLER: "1"
        run: bash tools/package.sh

      # Install the package like a user, start both programs, uninstall.
      - name: Smoke test
        run: bash tools/smoke_test.sh smoke

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-smoke
          path: smoke/
          if-no-files-found: ignore

  # Software bills of materials (CycloneDX 1.6) of the release packages, one
  # per platform, from Cargo.lock, app/package-lock.json, the fonts and the
  # bundled data (tools/sbom.py, docs/cra/requirements.md). Runs for every
  # push and pull request as a check; on version tags the release jobs attach
  # the files. Read only: the artifact is the only thing it hands on.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: SBOM files
        run: |
          # The commit time as the SBOM timestamp: the same commit gives the
          # same files.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python tools/sbom.py --check
          python tools/sbom.py --out sbom
          # The Android SBOM goes with the APK (android-release), which is
          # only attached when it was signed.
          mkdir -p sbom-android
          mv sbom/*-sbom-android-*.cdx.json sbom-android/
          ls -l sbom sbom-android

      # Not named caruspex-*: the release job collects those as packages.
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

      - name: Upload Android SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-android
          path: sbom-android/
          if-no-files-found: error

  # The Android app (docs/android.md): an APK for arm64 phones. Not a
  # required check and not part of the release job above; on version tags
  # the APK is signed and attached to the release only when the signing
  # secrets exist, otherwise it stays an unsigned build artifact.
  android:
    name: Android
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Interface packages
        run: npm --prefix app ci

      # The release key never lives in the repository: the secret holds the
      # keystore as base64 and is written to a temporary file for this run.
      - name: Signing key (version tags with secrets only)
        id: key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.CARUSPEX_ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No Android signing secrets: the APK stays unsigned and is not attached to the release."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/caruspex-release.jks"
          echo "file=$RUNNER_TEMP/caruspex-release.jks" >> "$GITHUB_OUTPUT"

      - name: APK
        id: apk
        env:
          # The passwords only enter the step when the keystore was written
          # (version tags with secrets); every other run builds unsigned.
          CARUSPEX_ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          CARUSPEX_ANDROID_KEYSTORE_PASSWORD: ${{ steps.key.outputs.file != '' && secrets.CARUSPEX_ANDROID_KEYSTORE_PASSWORD || '' }}
          CARUSPEX_ANDROID_KEY_ALIAS: ${{ steps.key.outputs.file != '' && secrets.CARUSPEX_ANDROID_KEY_ALIAS || '' }}
          CARUSPEX_ANDROID_KEY_PASSWORD: ${{ steps.key.outputs.file != '' && secrets.CARUSPEX_ANDROID_KEY_PASSWORD || '' }}
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([0-9.]*\)"/\1/p' Cargo.toml)
          (cd app && npx tauri android build --apk --target aarch64)
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk" || { echo "no APK was built" >&2; exit 1; }
          mkdir -p dist-android
          if [ -n "$CARUSPEX_ANDROID_KEYSTORE_FILE" ]; then
            cp "$apk" "dist-android/Caruspex-$version-android-arm64.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$apk" "dist-android/Caruspex-$version-android-arm64-unsigned.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$RUNNER_TEMP/caruspex-release.jks"
          ls -l dist-android

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist-android/
          if-no-files-found: error

  # Attaches the signed APK to the release the release job made.
  android-release:
    name: Android release
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.fork && needs.android.outputs.signed == 'true'
    needs: [android, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance of the APK (Sigstore through GitHub's OIDC token).
      id-token: write
      attestations: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: apk

      # --- Supply chain: SBOM, provenance and checksum of the APK. ---------
      - name: Download Android SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-android
          path: apk

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apk/*

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" apk/*.apk --repo "$GITHUB_REPOSITORY"

      # After the APK is attached, so a problem here never keeps it back.
      - name: SBOM and SHA256SUMS of the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" apk/*.cdx.json --repo "$GITHUB_REPOSITORY"
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir sums --repo "$GITHUB_REPOSITORY"
          (cd apk && sha256sum -- *) >> sums/SHA256SUMS
          cat sums/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" sums/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Only for version tags: one release with all packages and the change list
  # from changelog/<version>.md, plus what the updater of the app reads:
  # signed update packages, latest.json and copies under stable names.
  # Never in a fork: a fork that pushes the tags of this repository has no
  # updater key and would only fail at the signing step.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.fork
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only for the build provenance step (Sigstore through GitHub's OIDC
      # token); no other step uses them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the project version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([0-9.]*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          test -f "changelog/$version.md" || { echo "changelog/$version.md is missing" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: caruspex-*
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p upload
          find artifacts -path '*-smoke*' -prune -o -type f -print -exec cp {} upload/ \;

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The private half of the update key is never in the repository; it
      # comes from the repository secret CARUSPEX_UPDATER_KEY. The app only
      # installs what this key signed (public half in update.rs).
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CARUSPEX_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: none
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The repository secret CARUSPEX_UPDATER_KEY is missing. Add the content of caruspex-updater.key under Settings > Secrets and variables > Actions, then run this job again. Without it the release would have no signed updates."
            exit 1
          fi
          npm --prefix app ci
          for name in "Caruspex-$VERSION-windows-x64-setup.exe" \
                      "Caruspex-$VERSION-linux-x86_64.AppImage" \
                      "Caruspex-$VERSION-macos.app.tar.gz"; do
            test -f "upload/$name" || { echo "upload/$name is missing" >&2; exit 1; }
            npm --prefix app exec -- tauri signer sign "$PWD/upload/$name"
            test -s "upload/$name.sig" || { echo "no signature for $name" >&2; exit 1; }
          done

      # Checks every signature against the key in update.rs, writes
      # latest.json and the copies without version in the name. cryptography
      # comes in exact versions with their hashes (tools/requirements-release.txt).
      - name: Update manifest and stable names
        run: |
          pip install --quiet --require-hashes --only-binary :all: -r tools/requirements-release.txt
          python tools/release_assets.py "${{ steps.version.outputs.version }}" upload

      # --- Supply chain (docs/cra/requirements.md) -------------------------
      # SBOMs, SHA256SUMS and the build provenance. These steps only add
      # files with new names (Caruspex-<v>-sbom-*.cdx.json, SHA256SUMS,
      # Caruspex-<v>-provenance.sigstore.json) after the signing and
      # latest.json, and run before the release exists: if one fails there is
      # no release at all, never one without latest.json.
      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: upload

      - name: Checksums
        run: |
          cd upload
          test ! -e SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      # A signed statement that these files were built by this workflow from
      # this commit; `gh attestation verify` checks it (SECURITY.md).
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: upload/SHA256SUMS

      - name: Provenance bundle next to the packages
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: cp "$BUNDLE" "upload/Caruspex-$VERSION-provenance.sigstore.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l upload
          gh release create "$GITHUB_REF_NAME" upload/* \
            --title "Caruspex ${{ steps.version.outputs.version }}" \
            --notes-file "changelog/${{ steps.version.outputs.version }}.md" \
            --verify-tag
