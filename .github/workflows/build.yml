name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every step runs in bash so Windows, Linux and macOS share one syntax.
# PowerShell would otherwise split paths that contain a dot.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
            artifact: caruspex-windows-x64
          - name: Linux
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            artifact: caruspex-linux-x64
          # macos-14 instead of macos-latest: from macOS 15 on the SDK no longer
          # ships the AGL framework that the prebuilt Qt libraries still refer
          # to, and the linker fails with "framework 'AGL' not found".
          # macos-14 runs Xcode 15 and is Apple Silicon as well.
          - name: macOS
            os: macos-14
            qt_arch: clang_64
            artifact: caruspex-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages for Qt (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            ninja-build

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ runner.os == 'Windows' && 'windows' || (runner.os == 'macOS' && 'mac' || 'linux') }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtcharts
          cache: true

      - name: Set up Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan
          conan profile detect --force

      - name: Fetch dependencies
        run: >
          conan install .
          --output-folder="${{ github.workspace }}/build/conan"
          --build=missing
          -s compiler.cppstd=20

      - name: Trouble-code database is up to date
        run: |
          python tools/gen_dtc.py
          git add --intent-to-add src/data
          git diff --exit-code -- 'src/data/*.gen.cpp'

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCARUSPEX_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/conan/conan_toolchain.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # --- Collect the results ----------------------------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p package
          cp build/bin/Release/caruspex.exe package/
          cp build/bin/Release/caruspex_cli.exe package/
          cp LICENSE package/
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations package/caruspex.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp build/bin/caruspex package/
          cp build/bin/caruspex_cli package/
          cp LICENSE package/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp -R build/bin/caruspex.app package/
          cp build/bin/caruspex_cli package/
          cp LICENSE package/
          "$QT_ROOT_DIR/bin/macdeployqt" package/caruspex.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
