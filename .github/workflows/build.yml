name: Build

on:
  push:
    branches: [main]
    # A version tag (v0.9.0) also publishes a release with the packages.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Every step runs in bash so Windows, Linux and macOS share one syntax.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting, lints, generated tables and translations: once, on Linux.
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    # A hanging package mirror should fail fast, not block for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages
        run: |
          # On some runners the name resolution fails ('Temporary failure
          # resolving'); public resolvers as a fallback keep apt working.
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '%s\n' '[Resolve]' 'DNS=1.1.1.1 8.8.8.8' 'FallbackDNS=9.9.9.9' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved || true
          getent hosts azure.archive.ubuntu.com archive.ubuntu.com || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Generated tables are up to date
        run: |
          python tools/gen_dtc.py
          python tools/gen_vehicles.py
          python tools/gen_ecus.py
          python tools/gen_pids.py
          python tools/gen_engines.py
          # The opendbc packs in data/opendbc are written from a download
          # cache by tools/gen_opendbc.py and refreshed by hand; gen_pids.py
          # above turns them into Rust like data/pids.
          # The OBDb packs need the download cache and are refreshed by hand
          # (see tools/gen_obdb.py); the conversion is checked offline on
          # real OBDb commands with their recorded answers.
          python tools/gen_obdb.py --fixtures
          # Wikidata dimensions: the Rust table from the committed CSV, and
          # the conversion and matching on recorded answers (both offline).
          python tools/gen_dimensions.py
          python tools/gen_dimensions.py --fixtures
          git add --intent-to-add crates
          git diff --exit-code -- 'crates/*/src/generated' 'crates/caruspex-record/tests/fixtures' 'crates/caruspex-vehicles/tests/fixtures'

      # Every text in every language: new texts in the code must be
      # translated before they reach main (see translations/TRANSLATING.md).
      - name: Translations are complete
        run: python tools/i18n_rust.py --strict

      - name: README language bar is current
        run: python tools/readme_languages.py --check

      - name: Interface
        env:
          I18N_STRICT: "1"
        run: |
          npm --prefix app ci
          npm --prefix app run build
          npm --prefix app test

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: caruspex-windows-x64
          # 22.04 on purpose: the AppImage then also runs on older systems,
          # it needs at least the glibc of the machine that built it.
          - name: Linux
            os: ubuntu-22.04
            artifact: caruspex-linux-x64
          - name: macOS
            os: macos-15
            artifact: caruspex-macos

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: System packages (Linux only)
        if: runner.os == 'Linux'
        run: |
          # On some runners the name resolution fails ('Temporary failure
          # resolving'); public resolvers as a fallback keep apt working.
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '%s\n' '[Resolve]' 'DNS=1.1.1.1 8.8.8.8' 'FallbackDNS=9.9.9.9' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved || true
          getent hosts azure.archive.ubuntu.com archive.ubuntu.com || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev libudev-dev \
            pkg-config file patchelf libfuse2 xvfb

      # The 32-bit J2534 bridge: its test and the package need the target.
      - name: 32-bit target (Windows only)
        if: runner.os == 'Windows'
        run: rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # Built before the tests: the app has the interface built in.
      - name: Interface
        run: |
          npm --prefix app ci
          npm --prefix app run build

      - name: Tests
        run: cargo test --workspace

      - name: Inno Setup (Windows only)
        if: runner.os == 'Windows'
        run: |
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Package
        env:
          REQUIRE_INSTALLER: "1"
        run: bash tools/package.sh

      # Install the package like a user, start both programs, uninstall.
      - name: Smoke test
        run: bash tools/smoke_test.sh smoke

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-smoke
          path: smoke/
          if-no-files-found: ignore

  # The Android app (docs/android.md): an APK for arm64 phones. Not a
  # required check and not part of the release job above; on version tags
  # the APK is signed and attached to the release only when the signing
  # secrets exist, otherwise it stays an unsigned build artifact.
  android:
    name: Android
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Interface packages
        run: npm --prefix app ci

      # The release key never lives in the repository: the secret holds the
      # keystore as base64 and is written to a temporary file for this run.
      - name: Signing key (version tags with secrets only)
        id: key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.CARUSPEX_ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No Android signing secrets: the APK stays unsigned and is not attached to the release."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/caruspex-release.jks"
          echo "file=$RUNNER_TEMP/caruspex-release.jks" >> "$GITHUB_OUTPUT"

      - name: APK
        id: apk
        env:
          CARUSPEX_ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          CARUSPEX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CARUSPEX_ANDROID_KEYSTORE_PASSWORD }}
          CARUSPEX_ANDROID_KEY_ALIAS: ${{ secrets.CARUSPEX_ANDROID_KEY_ALIAS }}
          CARUSPEX_ANDROID_KEY_PASSWORD: ${{ secrets.CARUSPEX_ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([0-9.]*\)"/\1/p' Cargo.toml)
          (cd app && npx tauri android build --apk --target aarch64)
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk" || { echo "no APK was built" >&2; exit 1; }
          mkdir -p dist-android
          if [ -n "$CARUSPEX_ANDROID_KEYSTORE_FILE" ]; then
            cp "$apk" "dist-android/Caruspex-$version-android-arm64.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$apk" "dist-android/Caruspex-$version-android-arm64-unsigned.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$RUNNER_TEMP/caruspex-release.jks"
          ls -l dist-android

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist-android/
          if-no-files-found: error

  # Attaches the signed APK to the release the release job made.
  android-release:
    name: Android release
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.outputs.signed == 'true'
    needs: [android, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" apk/*.apk --repo "$GITHUB_REPOSITORY"

  # Only for version tags: one release with all packages and the change list
  # from changelog/<version>.md, plus what the updater of the app reads:
  # signed update packages, latest.json and copies under stable names.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the project version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([0-9.]*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          test -f "changelog/$version.md" || { echo "changelog/$version.md is missing" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: caruspex-*
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p upload
          find artifacts -path '*-smoke*' -prune -o -type f -print -exec cp {} upload/ \;

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The private half of the update key is never in the repository; it
      # comes from the repository secret CARUSPEX_UPDATER_KEY. The app only
      # installs what this key signed (public half in update.rs).
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CARUSPEX_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: none
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The repository secret CARUSPEX_UPDATER_KEY is missing. Add the content of caruspex-updater.key under Settings > Secrets and variables > Actions, then run this job again. Without it the release would have no signed updates."
            exit 1
          fi
          npm --prefix app ci
          for name in "Caruspex-$VERSION-windows-x64-setup.exe" \
                      "Caruspex-$VERSION-linux-x86_64.AppImage" \
                      "Caruspex-$VERSION-macos.app.tar.gz"; do
            test -f "upload/$name" || { echo "upload/$name is missing" >&2; exit 1; }
            npm --prefix app exec -- tauri signer sign "$PWD/upload/$name"
            test -s "upload/$name.sig" || { echo "no signature for $name" >&2; exit 1; }
          done

      # Checks every signature against the key in update.rs, writes
      # latest.json and the copies without version in the name.
      - name: Update manifest and stable names
        run: |
          pip install --quiet cryptography
          python tools/release_assets.py "${{ steps.version.outputs.version }}" upload

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l upload
          gh release create "$GITHUB_REF_NAME" upload/* \
            --title "Caruspex ${{ steps.version.outputs.version }}" \
            --notes-file "changelog/${{ steps.version.outputs.version }}.md" \
            --verify-tag
