name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Alle Schritte laufen in bash, damit Windows, Linux und macOS dieselbe
# Syntax benutzen. PowerShell zerlegt sonst Pfade mit Punkt darin.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
            artifact: caruspex-windows-x64
          - name: Linux
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            artifact: caruspex-linux-x64
          - name: macOS
            os: macos-latest
            qt_arch: clang_64
            artifact: caruspex-macos

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Systempakete fuer Qt (nur Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            ninja-build

      - name: Qt einrichten
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ runner.os == 'Windows' && 'windows' || (runner.os == 'macOS' && 'mac' || 'linux') }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtcharts
          cache: true

      - name: Conan einrichten
        run: |
          python -m pip install --upgrade pip
          pip install conan
          conan profile detect --force

      - name: Abhaengigkeiten holen
        run: >
          conan install .
          --output-folder="${{ github.workspace }}/build/conan"
          --build=missing
          -s compiler.cppstd=20

      - name: Fehlercode-Datenbank ist aktuell
        run: |
          python tools/gen_dtc.py
          git diff --exit-code src/data/DtcDatabase.gen.cpp

      - name: Konfigurieren
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCARUSPEX_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/conan/conan_toolchain.cmake"

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # --- Ergebnisse einsammeln -------------------------------------------
      - name: Paket schnueren (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p package
          cp build/bin/Release/caruspex.exe package/
          cp build/bin/Release/caruspex_cli.exe package/
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations package/caruspex.exe

      - name: Paket schnueren (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp build/bin/caruspex package/
          cp build/bin/caruspex_cli package/

      - name: Paket schnueren (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp -R build/bin/caruspex.app package/
          cp build/bin/caruspex_cli package/
          "$QT_ROOT_DIR/bin/macdeployqt" package/caruspex.app

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
