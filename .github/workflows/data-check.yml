name: Data check

# Once a month: are there new VIN codes, new or changed OBDb vehicles, new or
# changed dimensions in Wikidata or new DBC files upstream? If so, one issue
# lists what is new, by name. After working it in, run
# `python tools/check_sources.py --update` and commit data/sources.json,
# data/wmi_seen.txt and data/obdb_seen.txt, so the next check starts from there.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # The Wikidata queries take a few minutes, a busy query service longer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compare the sources
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/check_sources.py > report.md
          code=$?
          set -e
          cat report.md
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then exit "$code"; fi
          echo "changed=$([ "$code" -eq 10 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Open an issue with what is new
        if: steps.compare.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat report.md
            echo
            echo "After working it in: \`python tools/check_sources.py --update\`, then commit data/sources.json, data/wmi_seen.txt and data/obdb_seen.txt."
          } > body.md
          gh issue create --title "Datencheck $(date +%Y-%m)" --body-file body.md
