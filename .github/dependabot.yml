version: 2
updates:
  # The actions used by the CI (checkout, toolchains, caches, upload and
  # download of artifacts).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: CI

  # The Rust crates of the workspace (one Cargo.lock for all of them).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Cargo
    groups:
      rust:
        patterns: ["*"]
    # These follow tauri's wry: app/src-tauri/src/webview_win.rs hands the
    # WebView2 handles of wry to our own code, so they must be exactly the
    # versions wry uses. They are raised together with tauri, never alone.
    ignore:
      - dependency-name: windows
      - dependency-name: windows-core
      - dependency-name: webview2-com

  # The interface: React, Vite, TypeScript and the Tauri JavaScript API.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    commit-message:
      prefix: npm
    groups:
      interface:
        patterns: ["*"]
    # The types of Node follow the Node the project runs on (24, the
    # node-version in .github/workflows/build.yml): a new major of
    # @types/node describes APIs that Node 24 does not have. It is raised by
    # hand together with Node itself; minor and patch updates still come.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
