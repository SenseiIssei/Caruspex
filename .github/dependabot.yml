version: 2
updates:
  # The actions used by the CI (checkout, toolchains, caches, upload and
  # download of artifacts). The workflows pin every action by commit SHA
  # with the version as a comment (`@<sha> # v7.0.1`); Dependabot raises the
  # SHA and the comment together. One pull request for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: CI
    groups:
      actions:
        patterns: ["*"]

  # The Python packages of the release job (tools/requirements-release.txt,
  # exact versions with hashes); the checks themselves need only the
  # standard library.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: pip
    groups:
      release-tools:
        patterns: ["*"]

  # The Rust crates of the workspace (one Cargo.lock for all of them).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Cargo
    groups:
      rust:
        patterns: ["*"]
    # These follow tauri's wry: app/src-tauri/src/webview_win.rs hands the
    # WebView2 handles of wry to our own code, so they must be exactly the
    # versions wry uses. They are raised together with tauri, never alone.
    ignore:
      - dependency-name: windows
      - dependency-name: windows-core
      - dependency-name: webview2-com
      # The same for Linux: gtk, webkit2gtk and cairo-rs are wry's versions.
      - dependency-name: gtk
      - dependency-name: webkit2gtk
      - dependency-name: cairo-rs

  # The interface: React, Vite, TypeScript and the Tauri JavaScript API.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    commit-message:
      prefix: npm
    groups:
      interface:
        patterns: ["*"]
    # The types of Node follow the Node the project runs on (24, the
    # node-version in .github/workflows/build.yml): a new major of
    # @types/node describes APIs that Node 24 does not have. It is raised by
    # hand together with Node itself; minor and patch updates still come.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Android project that tauri generated (app/src-tauri/gen/android):
  # the Android Gradle plugin, Kotlin and the AndroidX libraries of the APK.
  # Their versions follow tauri's template, so no monthly version updates
  # (open-pull-requests-limit 0); security updates still come when they are
  # switched on in the repository settings (SECURITY.md, "Dependencies").
  - package-ecosystem: gradle
    directory: /app/src-tauri/gen/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: Gradle
